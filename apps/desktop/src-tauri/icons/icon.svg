  <rect x="96" y="96" width="88" height="88" rx="20" fill="#4d4d4d"/>
  <rect x="212" y="96" width="88" height="88" rx="20" fill="#808080"/>
  <rect x="328" y="96" width="88" height="88" rx="20" fill="#b3b3b3"/>
  <rect x="96" y="212" width="88" height="88" rx="20" fill="#808080"/>
  <rect x="212" y="212" width="88" height="88" rx="20" fill="#b3b3b3"/>
  <rect x="328" y="212" width="88" height="88" rx="20" fill="#f2f2f2"/>
  <rect x="96" y="328" width="88" height="88" rx="20" fill="#b3b3b3"/>
  <rect x="212" y="328" width="88" height="88" rx="20" fill="#f2f2f2"/>
  <rect x="328" y="328" width="88" height="88" rx="20" fill="#f2f2f2"/>
