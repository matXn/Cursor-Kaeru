  <!-- Tray icon: the app icon's nine-cell grid in plain white on transparent, filling the whole
       canvas so it lines up with the other tray icons. Read as one rounded tile cut by 2px
       gaps: only the grid's four outer corners are round (4px); the corners along the gaps are
       nearly square (1px). Cells are 10, 8, 10px so the gaps sit on even pixels and stay crisp
       when Windows halves the icon to 16px at 100% scaling. Rendered to tray.png. -->
